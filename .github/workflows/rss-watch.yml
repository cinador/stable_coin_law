name: RSS watch

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # seen.json 커밋용

concurrency:                  # 이전 실행이 안 끝났으면 겹치지 않게
  group: rss-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Check feed
        run: python rss_watch.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 다른 사이트를 볼 때만 주석 해제
          # FEED_URL: https://github.com/anthropics/claude-code/releases.atom
          # SITE_NAME: Claude Code 릴리스

      - name: Save seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "update seen.json [skip ci]"
            git push
          fi
